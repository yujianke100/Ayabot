<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>页面不存在 · Ayabot</title>
<meta name="robots" content="noindex">
<style>
  :root{--ink:#0b1020;--pink:#fb7299;--blue:#00a1d6}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ink);color:#fff;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:24px}
  .box{text-align:center;max-width:460px}
  .code{font-size:80px;font-weight:800;line-height:1;letter-spacing:-2px;
        background:linear-gradient(100deg,#fff,#ffb3c9 50%,#7fd8f5);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-size:20px;margin:18px 0 8px}
  p{color:rgba(255,255,255,.6);font-size:14.5px;line-height:1.7;margin:0 0 26px}
  a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#fff;font-weight:600;font-size:15px;
    background:linear-gradient(135deg,var(--pink),#ff5c8a);padding:11px 22px;border-radius:999px;
    box-shadow:0 10px 24px -10px rgba(251,114,153,.9)}
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>这个页面不存在</h1>
    <p>链接可能已经过期，或者地址打错了一个字。<br>回到主页看看 Ayabot 能做什么。</p>
    <a href="/">← 返回主页</a>
  </div>
</body>
</html>
