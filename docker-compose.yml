services:
  ayabot:
    image: ghcr.io/yujianke100/ayabot:latest
    container_name: ayabot
    restart: unless-stopped

    ports:
      # Web 管理后台 — 外部端口可自定义，如 "8000:19810"
      - "19810:19810"

    volumes:
      # 根配置文件（必须）— 从 config.example.yaml 复制
      - ./config.yaml:/app/config.yaml
      # 数据持久化（users.json, templates.json）
      - ./data:/app/data
      # 房间配置和数据（SQLite、房间 config.yaml、logs）
      - ./rooms:/app/rooms
      # B站扫码登录凭据
      - ./accounts:/app/accounts

    environment:
      - TZ=Asia/Shanghai
      # 容器内部监听端口，与 ports 右侧值保持一致
      - AYABOT_PORT=19810
