services:
  bili-bot:
    # ── 镜像来源 ──
    #    docker pull ghcr.io/yujianke100/ayabot:latest
    # 国内加速（ghcr.io 镜像站）:
    #    docker pull docker.mirrors.ustc.edu.cn/ghcr.io/yujianke100/ayabot:latest
    # 手动构建:
    #    docker build -t ayabot . ; 然后改 image: ayabot
    image: ghcr.io/yujianke100/ayabot:latest

    container_name: ayabot
    restart: unless-stopped

    ports:
      - "19810:19810"          # Web 管理后台

    volumes:
      # 根配置文件（必须）— 从 config.example.yaml 复制修改
      - ./config.yaml:/app/config.yaml
      # 数据持久化（users.json, templates.json）
      - ./data:/app/data
      # 房间配置和数据（SQLite 数据库、房间专属 config.yaml）
      - ./rooms:/app/rooms
      # B站扫码登录凭据
      - ./accounts:/app/accounts

    environment:
      - TZ=Asia/Shanghai
      - AYABOT_PORT=19810
