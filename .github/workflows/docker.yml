# ── Docker 镜像构建与多仓库推送 ──
#
# 主镜像：Docker Hub（方便国内用户通过镜像站加速拉取）
#   备用：ghcr.io（GitHub Container Registry）
#
# 启用 Docker Hub 推送:
#   仓库 → Settings → Secrets → Actions → 添加:
#     DOCKER_USERNAME: Docker Hub 用户名
#     DOCKER_PASSWORD: Docker Hub 访问令牌（Settings → Security → Access Tokens）
#
# 国内拉取加速（Docker Hub 镜像）:
#   docker pull hub-mirror.c.163.com/yujianke100/ayabot:latest
#   docker pull docker.mirrors.ustc.edu.cn/yujianke100/ayabot:latest
#
# 最新可用镜像站查询:
#   https://demo.kentxxq.com/app/mirror

name: Build & Push Docker Image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/yujianke100/ayabot
  DOCKERHUB_IMAGE: ${{ secrets.DOCKER_USERNAME && format('{0}/ayabot', secrets.DOCKER_USERNAME) || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU（ARM64 模拟）
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_IMAGE != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 清理 ghcr.io/Docker Hub 上同版本的旧镜像
        continue-on-error: true
        run: |
          ORG="${{ github.repository_owner }}"
          PACKAGE="ayabot"
          # 从 tag 提取版本号 (v0.1.1 -> 0.1.1)
          VER="${{ github.ref_name }}"
          VER="${VER#v}"
          echo "清理版本: $VER"

          # ── ghcr.io ──
          echo "--- ghcr.io ---"
          # 查找包含此版本 tag 的版本 ID
          gh api "/orgs/$ORG/packages/container/$PACKAGE/versions" --paginate 2>/dev/null \
            | jq -c ".[] | select(.metadata.container.tags | index(\"$VER\")) | .id" 2>/dev/null \
            | while read vid; do
              echo "删除 ghcr.io 版本 $vid (tag=$VER)"
              gh api -X DELETE "/orgs/$ORG/packages/container/$PACKAGE/versions/$vid" --silent 2>/dev/null || true
            done

          # ── Docker Hub ──
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "--- Docker Hub ---"
            TOKEN=$(curl -s -H "Content-Type: application/json" \
              -X POST -d "{\"username\":\"${{ secrets.DOCKER_USERNAME }}\",\"password\":\"${{ secrets.DOCKER_PASSWORD }}\"}" \
              "https://hub.docker.com/v2/users/login/" | jq -r .token 2>/dev/null)
            if [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ]; then
              curl -s -X DELETE \
                -H "Authorization: JWT $TOKEN" \
                "https://hub.docker.com/v2/repositories/${{ secrets.DOCKER_USERNAME }}/$PACKAGE/tags/$VER/" 2>/dev/null \
                && echo "删除 Docker Hub tag $VER 成功" || echo "Docker Hub tag $VER 不存在或无权限删除"
              # 也删 latest（后续会重建）
              curl -s -X DELETE \
                -H "Authorization: JWT $TOKEN" \
                "https://hub.docker.com/v2/repositories/${{ secrets.DOCKER_USERNAME }}/$PACKAGE/tags/latest/" 2>/dev/null || true
            fi
          fi
          echo "清理完成"

      - name: 确保 ghcr.io 包存在并可写（用 gh CLI 比 GITHUB_TOKEN 权限更高）
        continue-on-error: true
        run: |
          PACKAGE="ayabot"
          ORG="${{ github.repository_owner }}"
          # gh CLI 自带 GITHUB_TOKEN 认证，尝试创建/更新包
          if gh api "/orgs/$ORG/packages/container/$PACKAGE" --method GET --silent 2>/dev/null; then
            echo "包已存在，更新可见性为公开"
            gh api "/orgs/$ORG/packages/container/$PACKAGE/visibility" \
              --method POST \
              --field visibility="public" --silent 2>/dev/null || true
          else
            echo "包不存在，尝试用占位镜像触发创建..."
            echo "FROM scratch" | docker build --push \
              -t "ghcr.io/$ORG/$PACKAGE:__init__" - 2>/dev/null || true
            sleep 3
          fi
          # 关联仓库
          REPO_ID="${{ github.repository_id }}"
          gh api "/orgs/$ORG/packages/container/$PACKAGE/repository-connections" \
            --method POST \
            --input - <<< "{\"repository_ids\":[$REPO_ID]}" 2>/dev/null && echo "仓库关联成功" || \
          echo "仓库关联跳过（可能已关联）"
              curl -s -X DELETE \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/orgs/$ORG/packages/container/$PACKAGE/versions/$vid" 2>/dev/null || true
            done
          echo "=== 初始化完成 ==="

      - name: Extract metadata for Docker Hub
        id: meta_hub
        if: env.DOCKERHUB_IMAGE != ''
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Extract metadata for ghcr.io
        id: meta_ghcr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push to Docker Hub
        if: env.DOCKERHUB_IMAGE != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_hub.outputs.tags }}
          labels: ${{ steps.meta_hub.outputs.labels }}

      - name: Build and push to ghcr.io
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_ghcr.outputs.tags }}
          labels: ${{ steps.meta_ghcr.outputs.labels }}

      - name: 清理 ghcr.io 上无 tag 的旧镜像
        continue-on-error: true
        run: |
          echo "查找无 tag 的镜像版本..."
          ORG="${{ github.repository_owner }}"
          PACKAGE="ayabot"
          # 用 gh CLI 获取所有版本
          gh api "/orgs/$ORG/packages/container/$PACKAGE/versions" --paginate 2>/dev/null \
            | jq -c '.[] | select(.metadata.container.tags == [] or .metadata.container.tags == null) | .id' 2>/dev/null \
            | while read id; do
              echo "删除无 tag 版本: $id"
              gh api -X DELETE "/orgs/$ORG/packages/container/$PACKAGE/versions/$id" --silent 2>/dev/null || true
            done
          echo "清理完成"
