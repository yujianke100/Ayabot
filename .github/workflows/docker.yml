# ── Docker 镜像构建与多仓库推送 ──
#
# 主镜像：Docker Hub（方便国内用户通过镜像站加速拉取）
#   备用：ghcr.io（GitHub Container Registry）
#
# 启用 Docker Hub 推送:
#   仓库 → Settings → Secrets → Actions → 添加:
#     DOCKER_USERNAME: Docker Hub 用户名
#     DOCKER_PASSWORD: Docker Hub 访问令牌（Settings → Security → Access Tokens）
#
# 国内拉取加速（Docker Hub 镜像）:
#   docker pull hub-mirror.c.163.com/yujianke100/ayabot:latest
#   docker pull docker.mirrors.ustc.edu.cn/yujianke100/ayabot:latest
#
# 最新可用镜像站查询:
#   https://demo.kentxxq.com/app/mirror

name: Build & Push Docker Image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/yujianke100/ayabot
  DOCKERHUB_IMAGE: ${{ secrets.DOCKER_USERNAME && format('{0}/ayabot', secrets.DOCKER_USERNAME) || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU（ARM64 模拟）
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_IMAGE != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 确保 ghcr.io 包可写（首次推送前设置仓库关联）
        continue-on-error: true
        run: |
          PACKAGE="ayabot"
          # 设置包为公开可见，并关联到当前仓库
          ORG="${{ github.repository_owner }}"
          REPO_ID="${{ github.repository_id }}"
          echo "🔗 Linking $PACKAGE to repo $ORG/... (id=$REPO_ID)"
          curl -sL -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/orgs/$ORG/packages/container/$PACKAGE/repository-connections" \
            -d "{\"repository_ids\":[$REPO_ID]}" 2>/dev/null && echo "  ✅ org 级关联成功" || \
          curl -sL -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/user/packages/container/$PACKAGE/repository-connections" \
            -d "{\"repository_ids\":[$REPO_ID]}" 2>/dev/null && echo "  ✅ user 级关联成功" || \
          echo "  ⏳ 包尚未创建，首次推送时会自动建立"

      - name: Extract metadata for Docker Hub
        id: meta_hub
        if: env.DOCKERHUB_IMAGE != ''
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Extract metadata for ghcr.io
        id: meta_ghcr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push to Docker Hub
        if: env.DOCKERHUB_IMAGE != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_hub.outputs.tags }}
          labels: ${{ steps.meta_hub.outputs.labels }}

      - name: Build and push to ghcr.io
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_ghcr.outputs.tags }}
          labels: ${{ steps.meta_ghcr.outputs.labels }}

      - name: 清理 ghcr.io 上无 tag 的旧镜像
        continue-on-error: true
        run: |
          echo "🔍 查找无 tag 的镜像版本..."
          # 获取包的所有版本
          VERSIONS=$(gh api "/orgs/${{ github.repository_owner }}/packages/container/ayabot/versions" --paginate 2>/dev/null) || {
            # 如果 org 级别失败，尝试 user 级别
            VERSIONS=$(gh api "/user/packages/container/ayabot/versions" --paginate 2>/dev/null) || {
              echo "⚠️ 无法获取版本列表，跳过清理"
              exit 0
            }
          }
          echo "$VERSIONS" | jq -c '.[] | select(.metadata.container.tags == [] or .metadata.container.tags == null) | .id' | while read id; do
            echo "🗑️  删除无 tag 版本: $id"
            gh api -X DELETE "/orgs/${{ github.repository_owner }}/packages/container/ayabot/versions/$id" 2>/dev/null || \
            gh api -X DELETE "/user/packages/container/ayabot/versions/$id" 2>/dev/null || \
            echo "⚠️  删除版本 $id 失败，可能无权限"
          done
          echo "✅ 清理完成"
