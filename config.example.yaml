room_display_id: 0
anchor_uid: 0

credential:
  sessdata: ""
  bili_jct: ""
  buvid3: ""
  dedeuserid: ""

features:
  welcome_enabled: true
  welcome_template: "欢迎 {uname} 来到直播间喵~"
  thanks_enabled: true
  thanks_template: "感谢 {uname} 送出的 {gift_name} x{gift_num}"
  blindbox_enabled: true
  allow_admin_as_anchor: false
  guard_thanks_enabled: true
  guard_thanks_template_captain: "感谢 {uname} 开通舰长 x{months}"
  guard_thanks_template_commander: "感谢 {uname} 开通提督 x{months}"
  guard_thanks_template_governor: "感谢 {uname} 开通总督 x{months}"
  guard_thanks_template_default: "感谢 {uname} 的大航海 ({guard_type}) x{months}"
  connected_message: "机器人已上线~"
  connected_message_enabled: true
  anchor_exclusive_reply: []
  keyword_reply:
    enabled: false
    cooldown: 30
    rules: []
  periodic_message_enabled: true
  periodic_message_interval_seconds: 600
  periodic_message_template: "点个关注不迷路喵~"
  pk_report_enabled: true           # PK开始/结束时汇报对手信息
  pk_report_template: "PK开始！对手{opponent}，{fans}粉，{guards}，{audience}观众，贡献{score}"
  like_thanks_enabled: false        # 点赞感谢开关
  like_thanks_template: "感谢 {uname} 的点赞~"
  share_thanks_enabled: false       # 转发感谢开关
  share_thanks_template: "感谢 {uname} 的分享~"
  follow_thanks_enabled: false      # 关注感谢开关
  follow_thanks_template: "感谢 {uname} 的关注~"  # PK汇报模板

cooldown:
  welcome_user_seconds: 600
  thanks_user_seconds: 10

rate_limit:
  send_interval_seconds: 1.2
  retry_count: 2
  max_queue_size: 50
  reply_delay_seconds: 3.0

runtime:
  poll_interval_seconds: 20
  timezone: "Asia/Shanghai"
  log_level: "INFO"

storage:
  sqlite_path: "data/bot.db"

auth:
  credential_store_path: "data/credential.json"
  auto_login: true
  qr_poll_seconds: 1.0
  refresh_interval_seconds: 3600

web_ui:
  enabled: true
  host: "0.0.0.0"
  port: 19810                           # 监听端口，可通过环境变量 AYABOT_PORT 覆盖
  # username: "ayabot"                  # 默认管理员账号（见 README）
  # password: "123456"                  # 默认管理员密码（首次登录强制修改）
  session_timeout: 3600
  bot_name: "ayabot"

llm:
  enabled: false
  provider: "openai"
  api_key: ""
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o-mini"
  wake_word: "ayabot"
  temperature: 0.7
  top_p: 0.9
  max_tokens: 150
  system_prompt: "你是ayabot，一个可爱温柔的虚拟主播助手。所有回复必须控制在40字以内。"
  context:
    enabled: true
    mode: "isolated"
    content: "llm_only"
    max_messages: 10
